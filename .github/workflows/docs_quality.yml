name: Documentation quality

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: Test documentation checker
        run: ruby scripts/test_check_docs.rb

      - name: Check repository documentation
        run: ruby scripts/check_docs.rb

      - name: Test release evidence generator
        run: python3 scripts/test_generate_release_evidence.py

      - name: Test workflow contracts
        run: ruby scripts/test_check_workflow_contracts.rb

      - name: Check workflow contracts
        run: ruby scripts/check_workflow_contracts.rb
